<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>natelalor</title>
        <meta name="description" content="a personal website for creativity and goal tracking.">
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&family=Square+Peg&display=swap" rel="stylesheet">  
    </head>

    <body class="goals_body">
        <div class="nav">
            <input type="checkbox" id="nav-toggle" class="nav_toggle">
            <label for="nav-toggle" class="nav_white_flower_gif">
                <img src="images/flower_arrow_1.png" alt="Toggle menu" class="flower-closed">
                <img src="images/arrow_right.gif" alt="Toggle menu" class="flower-open">
            </label>

            <a href="about.html" class="nav_purple_flower_gif nav_item">
                <img src="images/flower_purple.gif" alt="About">
            </a>
            <a href="portfolio.html" class="nav_orange_flower_gif nav_item">
                <img src="images/flower_orange.gif" alt="Portfolio">
            </a>
            <a href="goals.html" class="nav_blue_flower_gif nav_item">
                <img src="images/flower_blue.gif" alt="Goals">
            </a>
            <a href="index.html" class="nav_white_flower_gif nav_item">
                <img src="images/flower_white.gif" alt="Home">
            </a>
        </div>

        <div class="goals_intro">
            <div class="goals_text_container">
                <h1 class="goals_title">Goals</h1>
                <p>
                    I am always moving - constantly looking for the next exciting activity, new skill to learn, new card game to play, next opportunity to learn and grow. This is where I document what I've accomplished and what I have yet to do.
                </p>
            </div>
            <div class="box slider-container">
                <!-- Photo List wrapper -->
                <div class="slider-track">
                    <img src="images/goals_photos/ceramic_bowl.png" alt="" class="slide">
                    <img src="images/goals_photos/sourdough.png" alt="" class="slide">
                    <img src="images/goals_photos/me_running.png" alt="" class="slide">
                    <img src="images/goals_photos/garden_small.png" alt="" class="slide">
                    <img src="images/goals_photos/garden_big.png" alt="" class="slide">
                    <img src="images/goals_photos/ceramics_collection.jpg" alt="" class="slide">
                    <img src="images/goals_photos/celtics.png" alt="" class="slide">
                </div>
                <!-- Bottom Control Bar -->
                <div class="controls-container">
                    <button class="nav-btn" onclick="changeSlide(-1)">&#10094;</button>
                    <!-- Dots wrapper (generated dynamically by JS) -->
                    <div id="dots-container" class="dots-container"></div>
                    <button class="nav-btn" onclick="changeSlide(1)">&#10095;</button>
                </div>
                </div>
        </div>
        <div class="widget">
            <header>
                <h1 class="goals_h1">Goal Progress</h1>
                <div class="tally" id="tally"></div>
            </header>

            <div class="card">
                <canvas id="chart"></canvas>
            </div>

            <div class="master-list">
                <div class="list-columns">
                    <section class="list-section">
                    <h2 class="list-heading">Completed</h2>
                    <ul class="goal-list" id="completedList"></ul>
                    </section>

                    <section class="list-section">
                    <h2 class="list-heading">Working On It</h2>
                    <ul class="goal-list plain" id="notDoneList"></ul>
                    </section>
                </div>
            </div>
        </div>

        <script src="photos_scroller.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
        <script src="goals_graph.js"></script>
    </body>
</html>
