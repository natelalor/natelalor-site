            </label>

            <a href="about.html" class="nav_purple_flower_gif nav_item">

        <div class="goals_intro">
            <h1 class="goals_title">Goals</h1>
            <p>
                I am always moving. Constantly looking for the next exciting activity, new skill to learn, new card game to play, next opportunity to learn and grow. This is where I document what I've accomplished and what I have yet to do.
            </p>
        </div>
        <div class="widget">
            <header>
                <h1 class="goals_h1">Goal Progress</h1>
                <div class="tally" id="tally"></div>
            </header>

            <div class="card">
                <canvas id="chart"></canvas>
            </div>

            <div class="master-list">
                <div class="list-columns">
                    <section class="list-section">
                    <h2 class="list-heading">Completed</h2>
                    <ul class="goal-list" id="completedList"></ul>
                    </section>

                    <section class="list-section">
                    <h2 class="list-heading">Working On It</h2>
                    <ul class="goal-list plain" id="notDoneList"></ul>
                    </section>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
